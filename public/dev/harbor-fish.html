<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbor fishing bench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Lilita+One&display=swap">
<link rel="stylesheet" href="/css/base.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd9f5; }
  canvas { display: block; }
  #err { position: fixed; left: 8px; bottom: 8px; max-width: 70vw; background: #b00020; color: #fff; font: 12px monospace;
         padding: 6px 8px; white-space: pre-wrap; display: none; z-index: 99; }
  #info { position: fixed; left: 8px; top: 8px; color: #0e1630; font: 12px monospace; background: #ffffffbb; padding: 4px 6px; z-index: 9; }
  #track { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="labels"></div>
<pre id="err"></pre>
<div id="info"></div>
<pre id="track"></pre>
<script>
  const errs = [];
  const show = (m) => { errs.push(m); const e = document.getElementById('err'); e.style.display = 'block'; e.textContent = errs.slice(-6).join('\n'); };
  addEventListener('error', (e) => show('ERR ' + (e.error?.stack || e.message)));
  addEventListener('unhandledrejection', (e) => show('REJ ' + (e.reason?.stack || e.reason)));
  const ce = console.error.bind(console);
  console.error = (...a) => { show('console.error ' + a.map((x) => x?.stack || String(x)).join(' ')); ce(...a); };
</script>
<script type="module">
// Fishing-trip bench: two islands with radial piers (like islands.js), a rock in the fishing grounds and a camp islet,
// eleven boats with scripted port activity (single bursts, repeated bursts, lastActive-only, sustained, a port that
// closes mid-trip). ?ff=<secs> fast-forwards before the first frame; ?track=1 writes a JSON summary into <pre id=track>
// (mode log, catches, min clearance to island discs, longest hull overlap per pair). ?rock=near squeezes a berth.
// Camera: ?focus=<kind>&zoom=3 or ?x=&z=&zoom=   ?labels=off  ?daynight=night
import * as THREE from 'three';
import { createEngine } from '/js/world/engine.js';
import { Vessel, FISHING } from '/js/world/harbor.js';
import { PAL, box, cyl, cone, at, V3, tickTweens } from '/js/world/kit.js';

const Q = new URLSearchParams(location.search);
const num = (k, d) => (Q.has(k) ? Number(Q.get(k)) : d);
const engine = createEngine({ container: document.body, labelRoot: document.getElementById('labels') });
const frameFns = [];
const onFrame0 = engine.onFrame;
engine.onFrame = (fn) => { frameFns.push(fn); return onFrame0(fn); };
let now = Date.now();

const ISL = [
  { id: 'home', x: 0, z: 0, r: 7 }, { id: 'east', x: 30, z: 8, r: 8 },
  Q.get('rock') === 'near' ? { id: 'rock', x: 12, z: 12, r: 3, rock: true } : { id: 'rock', x: 13.5, z: 13.5, r: 3, rock: true },
  { id: 'camp', x: -10, z: 22, r: 4, kind: 'camp' },
];
const world = { engine, snapshot: { sessions: ['opus', 'sonnet', 'haiku', 'fable'].map((f) => ({ key: 's-' + f, faction: f })) }, layout: new Map(), islands: new Map(), vessels: new Map() };
const land = new THREE.Group();
engine.root.add(land);
for (const I of ISL) {
  world.layout.set(I.id, { x: I.x, z: I.z, r: I.r, ext: I.r });
  const g = new THREE.Group();
  g.position.set(I.x, 0, I.z);
  if (I.rock) g.add(at(cyl(I.r * 0.8, I.r, 1.6, 7, PAL.rock), 0, -0.6, 0), at(cone(I.r * 0.75, 1.3, 7, PAL.rockDark), 0, 1.0, 0));
  else {
    g.add(at(cyl(I.r + 0.2, I.r + 0.9, 1.2, 16, PAL.sand), 0, -0.8, 0));
    if (I.kind !== 'camp') {
      g.add(at(cyl(I.r - 0.6, I.r - 0.3, 1.0, 16, PAL.cliff), 0, 0.3, 0), at(cyl(I.r - 0.5, I.r - 0.55, 0.18, 16, PAL.grass), 0, 1.3, 0));
      for (let k = 0; k < 7; k++) { const a = k * 2.4, d = (k % 3) * 1.6 + 1; g.add(at(cone(0.7, 1.5, 6, PAL.leaf), Math.cos(a) * d, 1.45, Math.sin(a) * d)); }
    } else g.add(at(cone(0.9, 1.1, 4, 0xff7a59), 0.6, 0.4, -0.3));
  }
  land.add(g);
  engine.addFoamRing?.({ x: I.x, z: I.z }, I.r + 0.4);
  world.islands.set(I.id, { data: { kind: I.kind || 'repo', id: I.id }, group: g, radius: I.r, annexes: new Map(), platforms: [] });
}
// radial pier like islands.js: root/pierEnd on the axis, berth beside it at 55%, dir outward, owner = the island
function pierDock(I, t) {
  const C = V3(I.x, 0, I.z), u = V3(Math.cos(t), 0, Math.sin(t)), v = V3(u.z, 0, -u.x);
  const a = I.r - 0.8, e = I.r + 3.5, g = new THREE.Group();
  g.position.copy(C);
  g.rotation.y = Math.atan2(u.x, u.z);
  g.add(at(box(0.95, 0.08, e - a, PAL.wood), 0, 0.37, (a + e) / 2));
  for (let z = a + 0.6; z < e; z += 1.2) for (const s of [-1, 1]) g.add(at(cyl(0.07, 0.08, 1.45, 5, PAL.woodDark), s * 0.475, -1.0, z));
  land.add(g);
  return {
    owner: { position: C }, dir: u.clone(), root: C.clone().addScaledVector(u, a).setY(0.45), pierEnd: C.clone().addScaledVector(u, e).setY(0.45),
    berth: C.clone().addScaledVector(u, I.r + 1.925).addScaledVector(v, 1.3), setSign() {},
  };
}
const S = (list) => (t) => list.some(([a, b]) => t >= a && t < b);
const PLAN = [
  { kind: 'node', label: 'Nuxt', owner: 's-opus', isl: 0, t: Math.PI / 4 - 1.26, act: S([[12, 13]]) },
  { kind: 'python', label: 'Uvicorn', owner: 's-sonnet', isl: 0, t: Math.PI / 4 - 0.9, act: (t) => t >= 12 && t < 62 && (t - 12) % 7 < 1 },
  { kind: 'ruby', label: 'Rails', owner: 's-fable', isl: 0, t: Math.PI / 4 - 0.54, act: () => false, la: [14, 30] },
  { kind: 'go', label: 'air', owner: 's-sonnet', isl: 0, t: Math.PI / 4 - 0.18, act: S([[12, 40]]), level: 0.7 },
  { kind: 'docker', label: 'supabase', isl: 0, t: Math.PI / 4 + 0.18, act: S([[13, 14], [25, 26]]), ports: [54321, 54322, 54323] },
  { kind: 'db', label: 'Postgres', isl: 0, t: Math.PI / 4 + 0.54, act: S([[15, 16]]) },
  { kind: 'browser', label: 'Headless browser', owner: 's-haiku', isl: 0, t: Math.PI / 4 + 0.9, act: S([[12, 13], [22, 23], [32, 33]]) },
  { kind: 'ai', label: 'Ollama', owner: 's-opus', isl: 0, t: Math.PI / 4 + 1.26, act: S([[16, 17], [28, 29]]) },
  { kind: 'java', label: 'Spring', isl: 1, t: Math.PI - 0.2, act: S([[12, 13], [20, 21]]) },
  { kind: 'dotnet', label: '.NET', isl: 1, t: Math.PI + 0.2, act: S([[14, 15]]) },
  { kind: 'app', label: 'serve.js', isl: 1, t: Math.PI + 0.6, act: S([[13, 14]]), close: 30 },
];
const entries = PLAN.map((P, i) => {
  const port = { id: 'p' + i, port: 3000 + i, ports: P.ports || [3000 + i], kind: P.kind, label: P.label, owner: P.owner || null, activity: 0, lastActive: now - 60e3, restarts: 0 };
  const v = new Vessel(world, port, pierDock(ISL[P.isl], P.t), { instant: true });
  engine.root.add(v.group);
  world.vessels.set(port.id, v);
  return { P, port, v, log: [], clear: Infinity, clearAt: null, closed: false, last: null };
});

// ---- tracking ----------------------------------------------------------------------------------------------------
const pairs = new Map();
function seg(v) { const f = Math.max(0, v.halfLen - v.beam / 2), sx = Math.sin(v.wyaw) * f, sz = Math.cos(v.wyaw) * f; return [v.wx - sx, v.wz - sz, v.wx + sx, v.wz + sz]; }
function ptSeg(px, pz, s) { const dx = s[2] - s[0], dz = s[3] - s[1], L2 = dx * dx + dz * dz || 1e-9; const t = Math.max(0, Math.min(1, ((px - s[0]) * dx + (pz - s[1]) * dz) / L2)); return Math.hypot(px - s[0] - dx * t, pz - s[1] - dz * t); }
function hullGap(a, b) { const A = seg(a), B = seg(b); return Math.min(ptSeg(A[0], A[1], B), ptSeg(A[2], A[3], B), ptSeg(B[0], B[1], A), ptSeg(B[2], B[3], A)) - (a.beam + b.beam) / 2; }
function trackStep(dt, t) {
  for (const e of entries) {
    const v = e.v;
    if (v.mode !== e.last) { e.log.push(`${t.toFixed(1)}:${v.mode}`); e.last = v.mode; }
    if (v.mode === 'gone') continue;
    for (const I of ISL) {
      const c = Math.hypot(v.wx - I.x, v.wz - I.z) - I.r;
      if (c < e.clear) { e.clear = c; e.clearAt = `${t.toFixed(1)} ${I.id} ${v.mode}`; }
    }
  }
  for (let i = 0; i < entries.length; i++) for (let j = i + 1; j < entries.length; j++) {
    const a = entries[i].v, b = entries[j].v;
    if (a.mode === 'gone' || b.mode === 'gone' || (a.mode === 'moored' && b.mode === 'moored')) continue;
    let s = pairs.get(i + '-' + j);
    if (!s) pairs.set(i + '-' + j, (s = { cur: 0, max: 0, at: '' }));
    if (hullGap(a, b) < 0) { if (!s.cur) s.start = `${t.toFixed(1)} ${a.mode}/${b.mode}`; s.cur += dt; if (s.cur > s.max) { s.max = s.cur; s.at = s.start; } } else s.cur = 0;
  }
}
function trackDump(t) {
  document.getElementById('track').textContent = JSON.stringify({
    t: +t.toFixed(1), FISHING,
    vessels: entries.map((e) => ({ kind: e.P.kind, trips: e.v.trips, catches: e.v.catches, hold: e.v.hold, landed: e.v.landed, mode: e.v.mode, x: +e.v.wx.toFixed(1), z: +e.v.wz.toFixed(1), clear: +e.clear.toFixed(2), clearAt: e.clearAt, log: e.log.join(' ') })),
    overlaps: [...pairs.entries()].filter(([, s]) => s.max > 0).map(([k, s]) => `${k}:${s.max.toFixed(1)}s@${s.at}`),
  });
}

// ---- simulated snapshots + per-frame ---------------------------------------------------------------------------------
let snapAcc = 0, dumpAcc = 0;
const info = document.getElementById('info');
engine.onFrame((dt, t) => {
  now += dt * 1000;
  snapAcc += dt;
  if (snapAcc >= 1) {
    snapAcc -= 1;
    for (const e of entries) {
      if (e.closed) continue;
      const P = e.P, on = P.act(t);
      e.port = { ...e.port, activity: on ? P.level || 0.6 : 0 };
      if (on || (P.la && P.la.some((x) => t >= x && t < x + 1))) e.port.lastActive = now;
      if (P.close && t >= P.close) { e.closed = true; e.v.depart(); continue; }
      e.v.update(e.port);
    }
  }
  for (const e of entries) e.v.tick(dt, t);
  if (Q.has('track')) {
    trackStep(dt, t);
    dumpAcc += dt;
    if (dumpAcc > 1) { dumpAcc = 0; trackDump(t); }
  }
  info.textContent = `fishing bench · t=${t.toFixed(1)}s · ` + entries.map((e) => `${e.P.kind}:${e.v.mode}${e.v.catches ? '×' + e.v.catches : ''}`).join(' ');
});

const fk = Q.get('focus'), fe = fk && entries.find((e) => e.P.kind === fk);
function advance(secs, dt = 1 / 30) {
  for (let i = 0; i < Math.round(secs / dt); i++) {
    engine.time += dt;
    tickTweens(dt);
    for (const fn of frameFns) fn(dt, engine.time);
    engine.fx?.tick?.(dt);
  }
}
if (Q.has('ff')) advance(num('ff', 0));
if (Q.has('track')) trackDump(engine.time);
if (fe) engine.view.focus(V3(fe.v.wx, 0.8, fe.v.wz), { zoom: num('zoom', 3), secs: 0 });
else engine.view.focus(V3(num('x', 10), 0, num('z', 8)), { zoom: num('zoom', 0.9), secs: 0 });
window.bench = { engine, world, entries, advance };
</script>
</body>
</html>
