<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harbor bench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Lilita+One&display=swap">
<link rel="stylesheet" href="/css/base.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd9f5; }
  canvas { display: block; }
  #err { position: fixed; left: 8px; bottom: 8px; max-width: 70vw; background: #b00020; color: #fff; font: 12px monospace;
         padding: 6px 8px; white-space: pre-wrap; display: none; z-index: 99; }
  #info { position: fixed; left: 8px; top: 8px; color: #0e1630; font: 12px monospace; background: #ffffffbb; padding: 4px 6px; z-index: 9; }
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="labels"></div>
<pre id="err"></pre>
<div id="info"></div>
<script>
  const errs = [];
  const show = (m) => { errs.push(m); const e = document.getElementById('err'); e.style.display = 'block'; e.textContent = errs.slice(-6).join('\n'); };
  addEventListener('error', (e) => show('ERR ' + (e.error?.stack || e.message)));
  addEventListener('unhandledrejection', (e) => show('REJ ' + (e.reason?.stack || e.reason)));
  const ce = console.error.bind(console);
  console.error = (...a) => { show('console.error ' + a.map((x) => x?.stack || String(x)).join(' ')); ce(...a); };
</script>
<script type="module">
// Harbor bench: every vessel kind on a strip of beach with islands.js-style piers (berth alongside) and a couple of
// pontoon docks (bow-in), mixed activity/wear, plus timed arrival, burst (TOOT), restart (refuel), fresh paint and
// departure, plus a PortTown-style quay with two container berths (one ship arrives, the other leaves).
// URL: ?ff=6 fast-forward N seconds before the first frame (headless shots only advance ~0.5 s otherwise)
//      ?focus=<kind>|quay&zoom=3  ?x=&z=&zoom=  ?az=1 (rotate view)  ?only=node,docker  ?dports=6379 (docker ports)
//      ?t_arrive=1.5 ?t_burst=3 ?t_restart=4 ?t_paint=5 ?t_depart=6 ?t_qarrive=1.5 ?t_qdepart=9
//      ?sea=fast (whale + serpent right away)  ?subdive=1  ?daynight=night  ?labels=off
import * as THREE from 'three';
import { createEngine } from '/js/world/engine.js';
import { Vessel, SeaLife } from '/js/world/harbor.js';
import { PAL, mat, box, cyl, cone, sphere, at, textSign, V3, tickTweens } from '/js/world/kit.js';

const Q = new URLSearchParams(location.search);
const num = (k, d) => (Q.has(k) ? Number(Q.get(k)) : d);
const engine = createEngine({ container: document.body, labelRoot: document.getElementById('labels') });
// remember every per-frame callback so ?ff=<secs> can fast-forward the whole bench deterministically
const frameFns = [];
const onFrame0 = engine.onFrame;
engine.onFrame = (fn) => { frameFns.push(fn); return onFrame0(fn); };
const min = 60e3, hr = 3600e3, now = Date.now();

// ---- scenery: a long beach with a grassy bluff ------------------------------------------------------------------
const land = new THREE.Group();
land.name = 'bench-land';
engine.root.add(land);
land.add(at(box(96, 1.2, 8, PAL.sand), 0, -0.7, -4));
land.add(at(box(96, 1.0, 4.6, PAL.cliff), 0, 0.45, -5.7));
land.add(at(box(96.3, 0.22, 4.9, PAL.grass), 0, 1.4, -5.7));
for (let i = 0; i < 26; i++) {
  const x = -46 + i * 3.7 + Math.sin(i * 7.1) * 1.2, z = -5.2 - Math.abs(Math.sin(i * 3.3)) * 2;
  land.add(at(cyl(0.12, 0.16, 0.6, 5, PAL.woodDark), x, 1.6, z), at(cone(0.75, 1.5, 6, i % 3 ? PAL.leaf : PAL.leafDark), x, 2.1, z));
}
for (let x = -48; x <= 48; x += 12) engine.addFoamRing?.({ x, z: -60 }, 60.3, { strength: 0.8 });

// camp islet for the sea serpent
const camp = new THREE.Group();
camp.position.set(num('campx', -14), 0, num('campz', 17));
camp.add(at(cyl(3.2, 3.8, 0.9, 10, PAL.sand), 0, -0.5, 0), at(cone(0.9, 1.1, 4, 0xff7a59), 0.6, 0.4, -0.3), at(cyl(0.05, 0.05, 1.4, 4, PAL.woodDark), -1, 0.4, 0.8));
engine.root.add(camp);
engine.addFoamRing?.({ x: camp.position.x, z: camp.position.z }, 3.7);

// ---- docks ---------------------------------------------------------------------------------------------------
// Pier docks mimic islands.js: root (landward end) and pierEnd are Vector3s on the pier axis, the berth sits beside
// the pier at 55% of its length, dir points out to sea, setSign() writes the signpost at the land end.
function pierDock(x, { container = false } = {}) {
  const len = container ? 5.2 : 3.5, w = container ? 1.3 : 0.95, lat = container ? 1.8 : 1.3;
  const g = new THREE.Group();
  const z0 = -1.4;
  g.add(at(box(w, 0.08, len - z0, container ? 0xcfcadb : PAL.wood), x, 0.37, (len + z0) / 2));
  for (let z = z0 + 0.6; z < len; z += 1.2) for (const s of [-1, 1]) g.add(at(cyl(0.07, 0.08, 1.45, 5, PAL.woodDark), x + s * w / 2, -1.0, z));
  g.add(at(cyl(0.035, 0.045, 1.05, 5, PAL.metalDark), x - w / 2 + 0.08, 0.42, len - 0.2), at(box(0.18, 0.18, 0.18, 0xfff0c0), x - w / 2 + 0.08, 1.4, len - 0.2));
  g.add(at(cyl(0.05, 0.06, 1.6, 5, PAL.woodDark), x - w / 2 - 0.28, 0.15, z0 + 0.45));
  land.add(g);
  let sign = null;
  return {
    root: V3(x, 0.45, z0), pierEnd: V3(x, 0.45, len), berth: V3(x + lat, 0, len * 0.55), dir: V3(0, 0, 1), facing: 0, container,
    setSign(text) {
      if (sign) g.remove(sign);
      sign = textSign(text, { w: Math.max(0.75, 0.35 + text.length * 0.12), h: 0.34, bg: '#1d2748', fg: '#ffe38a', border: '#ffc53d' });
      at(sign, x - w / 2 - 0.28, 1.6, z0 + 0.45, { ry: Math.PI / 4 });
      g.add(sign);
    },
  };
}
const pontoonDock = (x, z = 3.2) => ({ berth: V3(x, 0, z), dir: V3(0, 0, 1) });

// ---- the fleet -------------------------------------------------------------------------------------------------
const SESS = ['opus', 'sonnet', 'haiku', 'fable', 'merc'].map((f) => ({ key: 's-' + f, faction: f, name: f }));
const FLEET = [
  { kind: 'node', port: 3000, label: 'Nuxt', owner: 's-opus', act: 0, idle: 0, repo: 'storefront-nuxt' },
  { kind: 'bun', port: 3001, label: 'Bun', owner: 's-haiku', act: 0.35, idle: 0 },
  { kind: 'deno', port: 8000, label: 'Deno', owner: null, act: 0, idle: 40 * min },
  { kind: 'python', port: 8001, label: 'Uvicorn', owner: 's-sonnet', act: 0.6, idle: 0 },
  { kind: 'php', port: 8080, label: 'Laravel', owner: null, act: 0, idle: 3 * hr, repo: 'legacy-crm' },
  { kind: 'ruby', port: 3002, label: 'Rails', owner: 's-fable', act: 0.25, idle: 0 },
  { kind: 'java', port: 8081, label: 'Spring', owner: 's-merc', act: 0.7, idle: 0 },
  { kind: 'go', port: 8082, label: 'air', owner: 's-sonnet', act: 1, idle: 0 },
  { kind: 'dotnet', port: 5000, label: '.NET', owner: null, act: 0, idle: 8 * hr },
  { kind: 'web', port: 80, label: 'nginx', owner: null, act: 0.5, idle: 0 },
  { kind: 'ai', port: 11434, label: 'Ollama', owner: 's-opus', act: 0.3, idle: 0 },
  { kind: 'docker', id: 'ctr:supabase_db', ports: [54321, 54322, 54323, 54324, 54327], label: 'supabase', owner: null, act: 0.8, idle: 0, container: true },
  { kind: 'db', port: 5432, label: 'Postgres', owner: null, act: 0, idle: 13 * hr },
  { kind: 'browser', port: 9222, label: 'Headless browser', owner: 's-haiku', act: 0, idle: 2 * min },
  { kind: 'app', port: 4000, label: 'serve.js', owner: null, act: 0, idle: 20 * hr },
];
if (Q.has('dports')) FLEET.find((f) => f.kind === 'docker').ports = Q.get('dports').split(',').map(Number);
const only = Q.get('only')?.split(',');
const fleet = only ? FLEET.filter((f) => only.includes(f.kind)) : FLEET;

const world = { engine, snapshot: { sessions: SESS }, islands: new Map(), vessels: new Map(), buildings: new Map() };
world.islands.set('camp', { data: { kind: 'camp', id: 'camp' }, group: camp, radius: 3.5 });
// obstacle discs for fishing trips: the beach strip (a row of discs behind the shoreline) and the camp islet
world.layout = new Map([['camp', { x: camp.position.x, z: camp.position.z, r: 3.5, ext: 3.5 }]]);
for (let bx = -50; bx <= 110; bx += 5) world.layout.set('beach' + bx, { x: bx, z: -6.8, r: 6.4, ext: 6.4 });
const portOf = (f) => ({
  id: f.id || String(f.port), port: f.ports ? f.ports[0] : f.port, ports: f.ports || [f.port], kind: f.kind, label: f.label,
  owner: f.owner, activity: f.act, lastActive: now - f.idle, since: now - 2 * hr, restarts: 0, repo: f.repo || null,
  container: f.container ? { name: f.id, image: 'supabase/postgres', project: 'supabase', status: 'running' } : null,
});

let x = -32;
const entries = [];
for (const f of fleet) {
  if (f.container) x += 0.6;
  const dock = pierDock(x, { container: !!f.container });
  const port = portOf(f);
  const v = new Vessel(world, port, dock, { instant: true });
  engine.root.add(v.group);
  engine.pick?.add?.(v.group, { type: 'port', id: port.id });
  world.vessels.set(port.id, v);
  entries.push({ f, port, v, dock, x });
  x += f.container ? 5.0 : 4.2;
}
const extra = [pontoonDock(x + 1.5), pontoonDock(x + 5.5)];
// a stone quay with two container berths like Port Localhost's terminal: berth on the dock axis, 1.35 off the edge
const QX = x + 14, QZ = 2.4, QTOP = 1.25;
land.add(at(box(12, QTOP + 1.2, 5.4, 0xcfcadb), QX, -1.2, QZ - 2.7), at(box(12, 0.06, 0.2, PAL.hazard), QX, QTOP, QZ - 0.25));
const quayOwner = { position: V3(QX, 0, QZ - 6) };
for (const dx of [-4, 0, 4]) world.layout.set('quay' + dx, { x: QX + dx, z: QZ - 2.4, r: 2.6, ext: 2.6 });
const quayDock = (bx) => ({ owner: quayOwner, root: V3(bx, QTOP, QZ - 0.3), pierEnd: V3(bx, QTOP, QZ), berth: V3(bx, 0, QZ + 1.35), dir: V3(0, 0, 1), container: true, setSign() {} });
const quay = [quayDock(QX - 2.2), quayDock(QX + 2.2)];
{
  const f = { kind: 'docker', id: 'ctr:quay-pgsql', ports: [5432], label: 'pgsql', owner: null, act: 0.6, idle: 0, container: true };
  const port = portOf(f), v = new Vessel(world, port, quay[0], { instant: true });
  engine.root.add(v.group);
  world.vessels.set(port.id, v);
  entries.push({ f, port, v, dock: quay[0] });
}

// ---- timeline ----------------------------------------------------------------------------------------------------
const T = { arrive: num('t_arrive', 1.5), burst: num('t_burst', 3), restart: num('t_restart', 4), paint: num('t_paint', 5), depart: num('t_depart', 6) };
const done = new Set();
const find = (k) => entries.find((e) => e.f.kind === k);
function at_(key, t, fn) { if (!done.has(key) && engine.time >= t) { done.add(key); try { fn(); } catch (e) { console.error(e); } } }
let snapT = 0;
const info = document.getElementById('info');
engine.onFrame((dt, t) => {
  at_('arrive', T.arrive, () => {
    const f = { kind: 'python', port: 5001, label: 'Flask', owner: 's-fable', act: 0.5, idle: 0 };
    const port = portOf(f), v = new Vessel(world, port, extra[0], {});
    engine.root.add(v.group);
    world.vessels.set(port.id, v);
    entries.push({ f, port, v, dock: extra[0] });
    const g = { kind: 'go', port: 7070, label: 'bench', owner: null, act: 0.2, idle: 0 };
    const p2 = portOf(g), v2 = new Vessel(world, p2, extra[1], { instant: true });
    engine.root.add(v2.group);
    world.vessels.set(p2.id, v2);
    entries.push({ f: g, port: p2, v: v2, dock: extra[1] });
  });
  at_('qarrive', num('t_qarrive', 1.5), () => {
    const f = { kind: 'docker', id: 'ctr:quay-redis', ports: [6379, 6380, 6381], label: 'redis', owner: 's-sonnet', act: 0.4, idle: 0, container: true };
    const port = portOf(f), v = new Vessel(world, port, quay[1], {});
    engine.root.add(v.group);
    world.vessels.set(port.id, v);
    entries.push({ f, port, v, dock: quay[1] });
  });
  at_('qdepart', num('t_qdepart', 9), () => { const e = entries.find((q) => q.port.id === 'ctr:quay-pgsql'); if (e) e.v.depart().then(() => { e.v.dispose(); entries.splice(entries.indexOf(e), 1); }); });
  at_('burst', T.burst, () => { const e = find('node'); if (e) { e.port = { ...e.port, activity: 0.9, lastActive: Date.now() }; e.v.update(e.port); } });
  at_('restart', T.restart, () => { const e = find('bun'); if (e) { e.port = { ...e.port, restarts: 1 }; e.v.update(e.port); } });
  at_('paint', T.paint, () => { const e = find('db'); if (e) { e.port = { ...e.port, activity: 0.6, lastActive: Date.now() }; e.v.update(e.port); } });
  at_('depart', T.depart, () => { const e = find('ruby'); if (e) e.v.depart().then(() => { e.v.dispose(); world.vessels.delete(e.port.id); entries.splice(entries.indexOf(e), 1); }); });
  // simulated snapshots once a second: the cutter's activity breathes
  snapT -= dt;
  if (snapT <= 0) {
    snapT = 1;
    for (const e of entries) {
      if (e.f.kind === 'web') e.port = { ...e.port, activity: 0.5 + 0.5 * Math.sin(t * 0.5), lastActive: Date.now() };
      else if (e.port.activity > 0.06) e.port = { ...e.port, lastActive: Date.now() };
      if (!e.v.disposed) e.v.update(e.port);
    }
  }
  for (const e of entries) e.v.tick(dt, t);
  const ri = engine.renderer.info.render;
  if (!window.__meshCount || engine.time - window.__meshCountT > 1) {
    window.__meshCountT = engine.time;
    let n = 0, cast = 0;
    for (const e of entries) e.v.group.traverseVisible((o) => { if (o.isMesh) { n++; if (o.castShadow) cast++; } });
    window.__meshCount = `meshes/vessel=${(n / Math.max(1, entries.length)).toFixed(1)} casters=${(cast / Math.max(1, entries.length)).toFixed(1)}`;
  }
  info.textContent = `harbor bench · ${entries.length} vessels · t=${engine.time.toFixed(1)}s · calls=${ri.calls} tris=${ri.triangles} ${window.__meshCount}`;
});

if (Q.get('sea') === 'fast') {
  const sea = new SeaLife(world);
  sea.whaleT = 0.6;
  sea.serpentT = 0.4;
  engine.onFrame((dt, t) => sea.tick(dt, t));
}
if (Q.has('subdive')) { const e = find('browser'); if (e) e.v.subT = 0; }

// ---- camera ------------------------------------------------------------------------------------------------------
const fk = Q.get('focus');
const fe = fk && (fk === 'quay' ? { v: { group: { position: V3(QX, 0, QZ + 1) } } } : find(fk) || entries[Number(fk)]);
if (Q.has('az')) engine.view.rotate(num('az', 1), { secs: 0 });
if (fe) engine.view.focus(fe.v.group.position.clone().setY(0.8), { zoom: num('zoom', 3.2), secs: 0 });
else engine.view.focus(V3(num('x', -1), 0, num('z', 2)), { zoom: num('zoom', 0.92), secs: 0 });

function advance(secs, dt = 1 / 30) {
  for (let i = 0; i < Math.round(secs / dt); i++) {
    engine.time += dt;
    tickTweens(dt);
    for (const fn of frameFns) fn(dt, engine.time);
    engine.fx?.tick?.(dt);
  }
}
if (Q.has('ff')) advance(num('ff', 0));
window.bench = { engine, world, entries, advance };
</script>
</body>
</html>
